# Copy to config.yaml (never committed) and adjust if needed. The values below are the ones used
# for the evaluated batch. Models, providers and prompts are not set here: they are part of the
# code (Second_step_CLICpipeline/clic_extract/arms.json and the configuration modules), so that a
# batch manifest can record them with the code commit.

paths:
  raw: data/raw
  markdown: data/markdown
  runs: data/runs
  logs: data/logs
  database: data/clic.db

conversion:
  # Docling converts every PDF; OCR is switched on only when a page has fewer characters than this
  # in its embedded text layer (image only pages, such as a scanned copy).
  ocr_min_chars_per_page: 100

evaluation:
  gold: evaluation/gold
  markdown: data/markdown              # Docling Markdown, <document>.md, for the extra partner check
  prices: provider_prices(1).csv       # provider price list, used for the cost of each run
  protocols:                           # where the answer sits in a raw reply, see src/evaluation/validity.py
    B: schema
    C: schema
    D: schema
    multimodal_strict: schema
    targeted_text: schema
    targeted_multimodal: schema
    freeform_B: freeform
    freeform_light: freeform
    multimodal_open: freeform
    multimodal_combined_qwen_vl: freeform
    multimodal_combined_llama4_maverick: freeform
