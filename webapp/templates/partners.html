{% extends "base.html" %}
{% block title %}Partners - CLIC extraction{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold mb-6">Partners</h1>

<div class="bg-white border border-slate-200 rounded-lg p-5">
    <div class="flex items-center justify-between mb-4">
        <h2 class="font-semibold text-slate-800">All partners ({{ partners|length }})</h2>
        <input type="search" name="q" value="{{ q }}" placeholder="Filter by name"
               class="border border-slate-300 rounded-md px-3 py-1.5 text-sm"
               hx-get="/partners/search" hx-trigger="input changed delay:200ms" hx-target="#partner-table" hx-include="this">
    </div>
    <div id="partner-table">
        {% include "_partner_table.html" %}
    </div>
</div>
{% endblock %}
