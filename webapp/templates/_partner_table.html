<table class="w-full text-sm">
    <thead>
        <tr class="text-left text-slate-500 border-b border-slate-200">
            <th class="py-2 pr-4">Partner</th>
            <th class="py-2 pr-4">Category</th>
            <th class="py-2 pr-4">CLIC</th>
        </tr>
    </thead>
    <tbody>
        {% for p in partners %}
        <tr class="border-b border-slate-100">
            <td class="py-2 pr-4">{{ p.partner_name }}</td>
            <td class="py-2 pr-4">{{ p.partner_category }}</td>
            <td class="py-2 pr-4">{{ "yes" if p.is_clic else "no" }}</td>
        </tr>
        {% else %}
        <tr><td class="py-3 text-slate-400" colspan="3">No partners match.</td></tr>
        {% endfor %}
    </tbody>
</table>
